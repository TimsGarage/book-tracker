services:
  backend:
    image: ghcr.io/timsgarage/book-tracker/backend:latest

    container_name: bookend
    restart: unless-stopped
    environment:
      - PORT=8080 # This is the internal port 
      - GIN_MODE=release
      - DB_PATH=/data/bookend.db
      - JWT_SECRET=change-me-to-a-secure-random-secret
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - latios-network

networks:
  latios-network:
    external: true

